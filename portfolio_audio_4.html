<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Audio · Digital VU meters</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#02030a;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:#eaf1ff;
         background:radial-gradient(ellipse at 50% 30%,#10202e 0%,#060a10 70%)}
  #cv{position:absolute;inset:0;width:1920px;height:1080px}
  #title{position:absolute;left:110px;top:60px;pointer-events:none}
  #title b{display:block;font-size:60px;font-weight:800;letter-spacing:-.02em}
  #title span{display:block;margin-top:8px;font:500 20px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:rgba(110,240,200,.75);text-transform:uppercase}
  #btn{position:absolute;right:110px;top:70px;padding:20px 34px;border-radius:999px;font:700 24px 'Inter',sans-serif;color:#fff;border:0;cursor:pointer;
       background:linear-gradient(135deg,#22d3a0,#2d7dff);box-shadow:0 0 40px rgba(40,200,170,.4)}
  #btn.on{background:linear-gradient(135deg,#ff9a3c,#ff4d4d)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="title"><b>Level Meters</b><span>Analog VU + digital LED · peak hold · <i id="mode" style="font-style:normal">synthetic demo</i> · <i id="tc" style="font-style:normal">0.00s</i></span></div>
  <button id="btn">▶ Enable live audio</button>
</div>

<script>
const W = 1920, H = 1080, D = 8, TAU = Math.PI * 2;
const stage = document.getElementById('stage'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const tcEl = document.getElementById('tc'), modeEl = document.getElementById('mode'), btn = document.getElementById('btn');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

// ===== Procedural audio engine (Web Audio) + deterministic synthetic models =====
// No external files: drums, bass and analyzers come from oscillators/noise.
// "demo" mode: pure synthetic curves of t (8 s loop, works with seek).
// "live" mode: after a user click, real AnalyserNodes drive the visuals.
const Engine = (() => {
  let ac, bus, master, an, anL, anR, started = false, timer = null, nextT = 0, step = 0, noiseBuf, pattern = null, eq = [];
  const edges = Array.from({ length: 65 }, (_, i) => 40 * Math.pow(16000 / 40, i / 64));
  const defaultPattern = s => {
    const v = [];
    if (s % 4 === 0) v.push('kick');
    if (s === 10) v.push('kick');
    if (s === 4 || s === 12) v.push('snare');
    if (s % 2 === 0) v.push(s === 14 ? 'hatO' : 'hat');
    const bn = { 0: 55, 3: 65.41, 6: 55, 10: 73.42, 12: 61.74 };
    if (bn[s]) v.push('bass:' + bn[s]);
    return v;
  };
  const noise = () => { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const out = pan => { const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(bus); return p; };
  const nz = (t, ftype, f, q, a, pk, d, pan, dur) => {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; const fl = ac.createBiquadFilter(); fl.type = ftype; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); env(g, t, a, pk, d); n.connect(fl); fl.connect(g); g.connect(out(pan)); n.start(t, Math.random() * .5); n.stop(t + dur);
  };
  const V = {
    kick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + .12); env(g, t, .003, .95, .32); o.connect(g); g.connect(out(0)); o.start(t); o.stop(t + .4); },
    snare(t) { nz(t, 'bandpass', 1800, .8, .002, .55, .17, -.25, .25); const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + .08); const g = ac.createGain(); env(g, t, .002, .4, .1); o.connect(g); g.connect(out(-.25)); o.start(t); o.stop(t + .15); },
    hat(t) { nz(t, 'highpass', 7000, .7, .001, .3, .05, .3, .2); },
    hatO(t) { nz(t, 'highpass', 7000, .7, .001, .3, .18, .3, .3); },
    clap(t) { for (let k = 0; k < 3; k++) nz(t + k * .011, 'bandpass', 1200, 1.2, .001, .35, k === 2 ? .14 : .02, .15, .2); },
    bass(t, f) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(180, t + .22); const g = ac.createGain(); env(g, t, .005, .45, .24); o.connect(fl); fl.connect(g); g.connect(out(0)); o.start(t); o.stop(t + .3); }
  };
  const trig = (name, t) => { if (name.startsWith('bass:')) V.bass(t, +name.slice(5)); else if (V[name]) V[name](t); };
  function sched() { while (nextT < ac.currentTime + .14) { for (const v of pattern(step % 16)) trig(v, nextT); nextT += .125; step++; } }
  return {
    get started() { return started; },
    get ctx() { return ac; },
    get eq() { return eq; },
    trig: (name) => { if (started) trig(name, ac.currentTime + .005); },
    start(patternFn) {
      if (patternFn) pattern = patternFn; else if (!pattern) pattern = defaultPattern;
      if (started) { ac.resume(); return; }
      ac = new (window.AudioContext || window.webkitAudioContext)();
      bus = ac.createGain(); let prev = bus;
      eq = [0, 1, 2, 3, 4].map(() => { const f = ac.createBiquadFilter(); f.type = 'peaking'; f.frequency.value = 1000; f.gain.value = 0; prev.connect(f); prev = f; return f; });
      master = ac.createGain(); master.gain.value = .85; prev.connect(master);
      an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .72; master.connect(an); an.connect(ac.destination);
      const sp = ac.createChannelSplitter(2); master.connect(sp);
      anL = ac.createAnalyser(); anR = ac.createAnalyser(); anL.fftSize = anR.fftSize = 1024; sp.connect(anL, 0); sp.connect(anR, 1);
      noiseBuf = noise(); started = true; ac.resume(); nextT = ac.currentTime + .08; step = 0; timer = setInterval(sched, 25);
    },
    stop() { if (!started) return; clearInterval(timer); ac.suspend(); started = false; ac.close(); },
    // 64 log-spaced bands (40 Hz–16 kHz), values 0..1
    spectrum(outArr) {
      if (!started) return false;
      const u = new Uint8Array(an.frequencyBinCount), nyq = ac.sampleRate / 2, n = u.length; an.getByteFrequencyData(u);
      for (let b = 0; b < 64; b++) { const lo = Math.floor(edges[b] / nyq * n), hi = Math.max(lo + 1, Math.ceil(edges[b + 1] / nyq * n)); let m = 0; for (let k = lo; k < hi && k < n; k++) m = Math.max(m, u[k]); outArr[b] = Math.pow(m / 255, 1.6); }
      return true;
    },
    levels() {
      if (!started) return null;
      const a = new Float32Array(anL.fftSize), b = new Float32Array(anR.fftSize); anL.getFloatTimeDomainData(a); anR.getFloatTimeDomainData(b);
      const rms = x => { let s = 0; for (const v of x) s += v * v; return Math.sqrt(s / x.length); };
      return [rms(a), rms(b)];
    }
  };
})();

// Pure synthetic models of t (120 BPM; 8 s period => perfect loop)
function synthSpec(t, outArr) {
  const beat = t * 2, bi = Math.floor(beat), bf = beat - bi;
  const kick = Math.exp(-bf * 7) * (bi % 4 === 0 ? 1 : .9), sn = (bi % 2 === 1) ? Math.exp(-bf * 9) : 0, hat = Math.exp(-((t * 4) % 1) * 13);
  for (let b = 0; b < 64; b++) {
    const x = b / 63;
    let v = kick * Math.max(0, 1 - x * 5) * .95;
    v += (.35 + .15 * Math.sin(TAU * t * 2)) * Math.exp(-Math.pow((x - .18) / .07, 2)) * .8;
    v += sn * Math.exp(-Math.pow((x - .5) / .18, 2)) * .8;
    v += hat * Math.max(0, (x - .62) / .38) * .65;
    v += .10 * (.5 + .5 * Math.sin(TAU * (t / 8 * (1 + b % 3)) + b)) * Math.exp(-Math.pow((x - .4) / .3, 2));
    const jit = .88 + .12 * (Math.abs(Math.sin(b * 12.9898) * 43758.5453) % 1);
    outArr[b] = Math.min(1, v * jit);
  }
}
function synthLevels(t) {
  const beat = t * 2, bi = Math.floor(beat), bf = beat - bi;
  const kick = Math.exp(-bf * 7), sn = (bi % 2 === 1) ? Math.exp(-bf * 9) : 0, hat = Math.exp(-((t * 4) % 1) * 13);
  return [.10 + .5 * kick + .30 * sn + .05 * hat, .10 + .5 * kick + .12 * sn + .22 * hat];
}


let live = false;
btn.onclick = () => {
  if (!live) { Engine.start(); live = true; btn.textContent = '■ Back to demo'; btn.classList.add('on'); modeEl.textContent = 'live audio (Web Audio)'; resetState(); }
  else { Engine.stop(); live = false; btn.textContent = '▶ Enable live audio'; btn.classList.remove('on'); modeEl.textContent = 'synthetic demo'; }
};

// ---- meter state (physics: damped spring on the needle, hold + fall on the peak) ----
const ch = [0, 1].map(() => ({ x: 0, v: 0, db: -90, pk: -90, pkT: 0, vpk: 0, vpkT: 0 }));
function resetState() { ch.forEach(c => { c.x = 0; c.v = 0; c.db = -90; c.pk = -90; c.pkT = 0; c.vpk = 0; c.vpkT = 0; }); }
const toDb = a => 20 * Math.log10(Math.max(a, 1e-5));
function step(t, lv, dt) {
  const w = TAU * 2.6, z = .78;
  lv.forEach((a, i) => {
    const c = ch[i];
    // VU: 0 VU = RMS 0.30; range -20..+3
    const vu = toDb(a / .30), target = Math.max(0, Math.min(1.08, (vu + 20) / 23));
    const acc = w * w * (target - c.x) - 2 * z * w * c.v;
    c.v += acc * dt; c.x += c.v * dt;
    if (c.x > c.vpk) { c.vpk = c.x; c.vpkT = t; } else if (t - c.vpkT > .6 || t < c.vpkT) c.vpk = Math.max(c.x, c.vpk - .55 * dt);
    // digital LED: instant attack, 22 dB/s release; sample peak ≈ RMS × 1.7
    const db = Math.min(-.1, toDb(a * 1.3));
    c.db = db > c.db ? db : Math.max(db, c.db - 22 * dt);
    if (c.db > c.pk) { c.pk = c.db; c.pkT = t; } else if (t - c.pkT > 1.0 || t < c.pkT) c.pk = Math.max(c.db, c.pk - 14 * dt);
  });
}
let lastLiveT = -1;
function advance(t, liveLoop) {
  const dt = 1 / 120;
  if (live && Engine.started) { const lv = Engine.levels(); if (lv) step(t, lv, 1 / 60); return; }
  resetState();
  for (let q = t - D; q < t; q += dt) step(q, synthLevels(((q % D) + D) % D), dt);   // warm up one full loop and simulate up to t
}

// ---- drawing ----
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function vuMeter(cx, cy, c, label, col) {
  const R = 330, a0 = -Math.PI / 2 - 0.95, a1 = -Math.PI / 2 + 0.95, ang = p => a0 + (a1 - a0) * p;
  // panel
  ctx.fillStyle = 'rgba(8,16,24,.85)'; ctx.strokeStyle = 'rgba(120,200,220,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(cx - 350, cy - 330, 700, 470, 34); ctx.fill(); ctx.stroke();
  // segment arc
  const segs = 46;
  for (let i = 0; i < segs; i++) {
    const p0 = i / segs, p1 = (i + .72) / segs, on = c.x * 1.0 >= (i + .5) / segs;
    const db = -20 + p0 * 23, color = db < -6 ? '#22d3a0' : db < 0 ? '#fbbf24' : '#ff4d5e';
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 20; ctx.globalAlpha = on ? 1 : .16;
    if (on) { ctx.shadowColor = color; ctx.shadowBlur = 20; }
    ctx.beginPath(); ctx.arc(cx, cy, R, ang(p0), ang(p1)); ctx.stroke(); ctx.restore();
  }
  // scale
  ctx.font = '600 24px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const v of [-20, -10, -7, -5, -3, 0, 3]) {
    const p = (v + 20) / 23, a = ang(p), r1 = R - 24, r2 = R - 44, r3 = R - 78;
    ctx.strokeStyle = v >= 0 ? '#ff6b7a' : 'rgba(200,225,235,.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
    ctx.fillStyle = v >= 0 ? '#ff8a96' : 'rgba(200,225,235,.85)'; ctx.fillText((v > 0 ? '+' : '') + v, cx + Math.cos(a) * r3, cy + Math.sin(a) * r3);
  }
  ctx.font = '800 54px Inter, sans-serif'; ctx.fillStyle = col; ctx.fillText('VU', cx, cy - 120);
  ctx.font = '700 28px Inter, sans-serif'; ctx.fillStyle = 'rgba(200,225,235,.7)'; ctx.fillText(label, cx, cy - 76);
  // peak marker (hold)
  const pa = ang(clamp(c.vpk, 0, 1.08));
  ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(cx + Math.cos(pa) * (R + 30), cy + Math.sin(pa) * (R + 30), 7, 0, TAU); ctx.fill(); ctx.restore();
  // needle with glow
  const na = ang(clamp(c.x, -.02, 1.1));
  ctx.save(); ctx.lineCap = 'round';
  for (const [w, a, b] of [[16, .12, 28], [9, .3, 14], [4, 1, 0]]) {
    ctx.globalAlpha = a; ctx.strokeStyle = col; ctx.lineWidth = w; if (b) { ctx.shadowColor = col; ctx.shadowBlur = b; }
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(na) * 40, cy - Math.sin(na) * 40); ctx.lineTo(cx + Math.cos(na) * (R - 16), cy + Math.sin(na) * (R - 16)); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#0b1218'; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, TAU); ctx.fill(); ctx.stroke();
}
function ledBar(x, y, w, h, c, label, col) {
  const n = 40, gap = 5, sh = (h - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    const db = -60 + (i + .5) / n * 60, yy = y + h - (i + 1) * sh - i * gap, on = c.db >= db;
    const color = db < -18 ? '#22d3a0' : db < -6 ? '#fbbf24' : '#ff4d5e';
    ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = on ? 1 : .13; if (on) { ctx.shadowColor = color; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.roundRect(x, yy, w, sh, 4); ctx.fill(); ctx.restore();
  }
  const py = y + h - clamp((c.pk + 60) / 60, 0, 1) * h;
  ctx.save(); ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; ctx.fillRect(x - 6, py - 3, w + 12, 6); ctx.restore();
  ctx.fillStyle = col; ctx.font = '800 34px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(label, x + w / 2, y + h + 50);
  ctx.fillStyle = '#fff'; ctx.font = '600 26px ui-monospace, Consolas, monospace'; ctx.fillText(c.pk > -89 ? c.pk.toFixed(1) : '-∞', x + w / 2, y - 18);
}
function render(t, liveLoop) {
  advance(t, liveLoop);
  ctx.clearRect(0, 0, W, H);
  vuMeter(440, 640, ch[0], 'LEFT', '#22d3ee');
  vuMeter(1150, 640, ch[1], 'RIGHT', '#f0abfc');
  // dBFS scale between the bars
  const bx1 = 1650, bx2 = 1760, by = 250, bh = 640;
  ctx.fillStyle = 'rgba(8,16,24,.85)'; ctx.strokeStyle = 'rgba(120,200,220,.2)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(1570, 170, 300, 800, 34); ctx.fill(); ctx.stroke();
  ledBar(bx1 - 40, by, 70, bh, ch[0], 'L', '#22d3ee'); ledBar(bx2 - 10, by, 70, bh, ch[1], 'R', '#f0abfc');
  ctx.fillStyle = 'rgba(190,215,225,.6)'; ctx.font = '500 20px ui-monospace, Consolas, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const d of [0, -6, -12, -24, -48]) ctx.fillText(d, 1715, by + bh - (d + 60) / 60 * bh);
  ctx.fillStyle = 'rgba(190,215,225,.5)'; ctx.textAlign = 'center'; ctx.fillText('dBFS', 1720, 205);
  tcEl.textContent = t.toFixed(2) + 's';
}
let manual = false, start = performance.now();
window.DURATION = D;
window.seek = s => { manual = true; if (live) { live = false; Engine.stop(); modeEl.textContent = 'synthetic demo'; btn.textContent = '▶ Enable live audio'; btn.classList.remove('on'); } render(((s % D) + D) % D, false); };
window.resume = () => { manual = false; start = performance.now(); };
(function loop() { if (!manual) render(((performance.now() - start) / 1000) % D, true); requestAnimationFrame(loop); })();
window.__ready = true;
</script>
</body>
</html>
