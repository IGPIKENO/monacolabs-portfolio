<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Origami Fold · Paper Interface</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="lib/pro.css">
<style>
:root{--bg:#e9e3f0;--fg:#241d2e;--mut:#5f5670;--acc2:#6a4fb3}.hud{text-shadow:none}
#stage{position:fixed;left:50%;top:7vh;z-index:3;width:min(340px,82vw);perspective:1700px;transform:translateX(-50%);cursor:pointer;user-select:none;-webkit-user-select:none}
#rig{transform-style:preserve-3d;position:relative;filter:drop-shadow(0 28px 30px rgba(60,40,90,.28))}
.p{position:relative;width:100%;height:var(--ph);transform-style:preserve-3d;transform-origin:50% 0}
.p>.p{position:absolute;left:0;top:100%}
.face,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;justify-content:center;font-family:'Inter',sans-serif;color:#2a2230}
.back{transform:rotateX(180deg);background:#efeaf5;display:grid;place-items:center;font:700 11px 'Space Grotesk',sans-serif;letter-spacing:.3em;color:#a79fb8}
.shade{position:absolute;inset:0;background:#2a1b45;opacity:0;pointer-events:none}
.k{font:600 10px 'Inter';letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.big{font:800 64px/.9 'Syne','Space Grotesk',sans-serif;letter-spacing:-.03em;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:15px}.row small{font-weight:500;opacity:.65;font-size:11px}
.bars{height:46px;background:repeating-linear-gradient(90deg,#2a2230 0 2px,transparent 2px 5px,#2a2230 5px 6px,transparent 6px 10px,#2a2230 10px 13px,transparent 13px 15px)}
.tl{position:relative;height:2px;background:#2a2230;margin:12px 6px}.tl i{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#f6f0e4;border:2px solid #2a2230}
#hint{position:fixed;right:28px;bottom:26px;text-align:right;z-index:4;font:600 11px 'Inter';letter-spacing:.2em;text-transform:uppercase;color:#5f5670;pointer-events:none}
</style>
</head>
<body class="light">
<div id="app"></div>
<div id="stage"><div id="rig">
 <div class="p" style="--c:#f4b8c8"><div class="face" style="background:#f4b8c8"><div class="k">Boarding pass · Seat 14A</div><div class="big">LIS</div><div class="row"><span>Lisbon, Portugal</span><small>Tue 11 Nov</small></div></div><div class="back">FOLD</div><div class="shade"></div>
  <div class="p"><div class="face" style="background:#cfe6d6"><div class="k">Flight</div><div class="row"><span>08:40 → 11:05</span><small>2 h 25 m</small></div><div class="row" style="margin-top:8px"><span>TP 1241</span><small>Gate B12 · Boards 08:05</small></div></div><div class="back">FOLD</div><div class="shade"></div>
   <div class="p"><div class="face" style="background:#f7e6a6"><div class="k">Stay</div><div class="row"><span>Casa do Largo</span><small>3 nights</small></div><div class="row" style="margin-top:8px"><span>Check-in 15:00</span><small>Room 7 · garden</small></div></div><div class="back">FOLD</div><div class="shade"></div>
    <div class="p"><div class="face" style="background:#c9d6f2"><div class="k">Day by day</div><div class="tl"><i style="left:0"></i><i style="left:46%"></i><i style="left:92%"></i></div><div class="row"><small>Alfama</small><small>Belém</small><small>Sintra</small></div></div><div class="back">FOLD</div><div class="shade"></div>
     <div class="p"><div class="face" style="background:#f2d3bd"><div class="k">Scan at the gate</div><div class="bars"></div></div><div class="back">FOLD</div><div class="shade"></div></div>
    </div></div></div></div>
</div></div>
<div id="hint">Click the card to fold or unfold it</div>
<script type="module">
import { createApp, THREE, ORTHO, fullscreenTriangle, hud, TAU, DURATION, smoothstep } from './lib/common.js';

hud({ eyebrow: 'Paper UI · CSS 3D hinges', title: 'Origami Fold', text: 'Five panels hang from one another on real hinges. Each fold shades the paper by the angle it makes with the light, and the stack settles into a flat card and back again.', tip: '' });
const app = createApp({ label: 'Origami · bg pass', clear: 0xe9e3f0, maxDpr: 1.5 });
const r = app.renderer;
const bg = new THREE.ShaderMaterial({ depthTest: false, depthWrite: false, uniforms: { uAsp: { value: 1 } }, vertexShader: `varying vec2 vUv; void main(){ vUv = position.xy * .5 + .5; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: `precision highp float; varying vec2 vUv; uniform float uAsp; float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  void main(){ vec3 a = vec3(.91, .89, .95), b = vec3(.96, .90, .90); vec3 col = mix(b, a, smoothstep(.0, 1., vUv.y)); col *= .94 + .06 * smoothstep(1.2, .0, length((vUv - vec2(.5, .6)) * vec2(uAsp, 1.)));
    col += (h21(vUv * 1200.) - .5) * .018; gl_FragColor = vec4(col, 1.); }` });
const mesh = new THREE.Mesh(fullscreenTriangle(), bg); mesh.frustumCulled = false; const scene = new THREE.Scene(); scene.add(mesh);
app.onResize((w, h) => { bg.uniforms.uAsp.value = w / h; document.getElementById('stage').style.setProperty('--ph', Math.max(96, Math.min(150, h * .17)) + 'px'); });

const panels = [...document.querySelectorAll('.p')], shades = panels.map(p => p.querySelector(':scope > .shade'));
const MAXA = 168;
let manual = null;            // user override: {angle, vel, target, last}
document.getElementById('stage').addEventListener('click', () => { const cur = manual ? manual.angle : lastAuto; manual = { angle: cur, vel: 0, target: cur > MAXA * .5 ? 0 : MAXA, last: performance.now() }; });
let lastAuto = 0;
const autoAngle = t => { const th = TAU * t / DURATION; return MAXA * smoothstep(.1, .9, .5 - .5 * Math.cos(th)); };
app.start((t, dt) => {
  lastAuto = autoAngle(t); let a = lastAuto;
  if (manual) { const d = Math.min(.05, dt || .016); manual.vel +=((manual.target - manual.angle) * 60 - manual.vel * 11) * d; manual.angle += manual.vel * d; a = Math.max(0, Math.min(180, manual.angle)); if (performance.now() - manual.last > 6000) manual = null; }
  panels.forEach((p, i) => { if (i === 0) { p.style.transform = ''; } else { const s = i % 2 ? -1 : 1; p.style.transform = `rotateX(${s * a}deg)`; } });
  const pitch = 10 + 8 * Math.sin(TAU * t / DURATION), rig = document.getElementById('rig'); rig.style.transform = `rotateX(${pitch}deg) rotateZ(${-3 * Math.sin(TAU * t / DURATION)}deg)`;
  // shading by fold angle: the faces that turn away from the light darken, the others brighten slightly
  shades.forEach((s, i) => { s.style.opacity = i === 0 ? 0 : (i % 2 ? .0 + .32 * Math.sin(a * Math.PI / 180) : .12 * Math.sin(a * Math.PI / 180)); });
  r.setRenderTarget(null); r.render(scene, ORTHO);
});
</script>
</body>
</html>
