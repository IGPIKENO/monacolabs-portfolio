<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monolith Dusk · Brutalist Desert</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="lib/pro.css">
<style>:root{--acc2:#f0a44b}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createApp, THREE, ORTHO, fullscreenTriangle, hud, rng, TAU, DURATION } from './lib/common.js';
import { Post } from './lib/post.js';

hud({ eyebrow: 'WebGL · Volumetric light · fBm sand', title: 'Monolith Dusk', text: 'Intact brutalist monoliths standing in a dead desert, an empty world lit by a dust-choked sun. Nothing is broken; the end of the world is all light and air. The sand is procedural: six-octave fBm with a synthetic normal map for grain and wind ripples. Crepuscular rays are marched through the haze.', tip: 'Move the cursor to steer the sun' });

const app = createApp({ label: 'Volumetric', clear: 0x3a2417 });
const r = app.renderer;
const post = new Post(r, { threshold: 0.85, knee: 0.7, bloomTight: 0.5, bloomWide: 0.7, radius: 1.15, ca: 0.0035, vignette: 0.5, grain: 0.03, exposure: 1.0 });

const U = { uSun: { value: new THREE.Vector3(0.0, 0.13, -1).normalize() }, uTh: { value: 0 } };
const R = rng(404);

// dune height field — identical in JS (to seat the buildings) and GLSL (to displace the ground)
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const duneJS = (x, z) => (1.2 * Math.sin(0.09 * x + 0.5 * Math.sin(0.06 * z)) + 0.8 * Math.sin(0.07 * z - 0.04 * x) + 0.35 * Math.sin(0.31 * x + 0.27 * z)) * (0.3 + 0.7 * smooth(2, 10, Math.abs(x)));
const DUNE_GLSL = /* glsl */`float dune(vec2 p){ float a = .3 + .7 * smoothstep(2., 10., abs(p.x)); return (1.2 * sin(.09 * p.x + .5 * sin(.06 * p.y)) + .8 * sin(.07 * p.y - .04 * p.x) + .35 * sin(.31 * p.x + .27 * p.y)) * a; }`;
// shared noise + sand: fBm height, grain and ripples, with a synthetic normal map
const SAND_GLSL = /* glsl */`
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h21(i), h21(i + vec2(1., 0.)), f.x), mix(h21(i + vec2(0., 1.)), h21(i + 1.), f.x), f.y); }
float fbm2(vec2 p){ float a = .5, s = 0.; mat2 m = mat2(1.6, 1.2, -1.2, 1.6); for (int i = 0; i < 6; i++) { s += a * vn(p); p = m * p; a *= .5; } return s; }
// micro-relief of sand: wind ripples bent by fBm + fine grains
float sandH(vec2 p){
  float rip = sin(dot(p, vec2(.95, .3)) * 3.4 + fbm2(p * .35) * 7.) * .5 + .5;
  return rip * .55 + fbm2(p * 3.) * .5 + vn(p * 22.) * .16 + vn(p * 7.) * .12;
}
vec3 sandNormal(vec2 p, vec3 N, float amp){
  float e = .03, h = sandH(p), hx = sandH(p + vec2(e, 0.)), hz = sandH(p + vec2(0., e));
  return normalize(N + vec3(-(hx - h), 0., -(hz - h)) / e * amp);
}
vec3 sandAlbedo(vec2 p){ float m = fbm2(p * .07), g = vn(p * 26.); return mix(vec3(.46, .29, .15), vec3(.80, .58, .34), m * .8 + g * .2); }
`;

// ---------- sky ----------
const VSQ = `varying vec2 vUv; void main(){ vUv = position.xy * .5 + .5; gl_Position = vec4(position.xy, 0., 1.); }`;
const SKY_FS = /* glsl */`
uniform vec3 uSun, uRight, uUp, uFwd; uniform float uTanH, uAspect, uOcc, uTh; varying vec2 vUv;
void main(){
  vec2 p = vUv * 2. - 1.; vec3 rd = normalize(uFwd + uRight * p.x * uTanH * uAspect + uUp * p.y * uTanH);
  float s = max(dot(rd, uSun), 0.), disc = smoothstep(.9985, .9992, s);
  if (uOcc > .5) { gl_FragColor = vec4(vec3(disc) + pow(s, 120.) * .5, 1.); return; }
  float h = rd.y;
  vec3 top = vec3(.10, .075, .07), mid = vec3(.42, .24, .14), hor = vec3(1., .56, .26);
  vec3 col = mix(hor, mid, smoothstep(0., .14, h)); col = mix(col, top, smoothstep(.08, .7, h));
  col += vec3(1., .62, .30) * pow(s, 10.) * .9 + vec3(1., .78, .5) * pow(s, 90.) * 1.2;
  col += vec3(1., .9, .7) * disc * 9.;
  col = mix(col, vec3(.55, .32, .16), smoothstep(.12, -.02, h) * .5);
  gl_FragColor = vec4(col, 1.);
}`;
const skyU = () => ({ uSun: U.uSun, uTh: U.uTh, uRight: { value: new THREE.Vector3() }, uUp: { value: new THREE.Vector3() }, uFwd: { value: new THREE.Vector3() }, uTanH: { value: 1 }, uAspect: { value: 1 }, uOcc: { value: 0 } });
const mkQuad = mat => { const m = new THREE.Mesh(fullscreenTriangle(), mat); m.frustumCulled = false; const s = new THREE.Scene(); s.add(m); return s; };
const skyMat = new THREE.ShaderMaterial({ vertexShader: VSQ, fragmentShader: SKY_FS, uniforms: skyU(), depthTest: false, depthWrite: false });
const sunOccMat = new THREE.ShaderMaterial({ vertexShader: VSQ, fragmentShader: SKY_FS, uniforms: Object.assign(skyU(), { uOcc: { value: 1 } }), depthTest: false, depthWrite: false });
const skyScene = mkQuad(skyMat), sunOccScene = mkQuad(sunOccMat);

// ---------- ground: dunes with procedural sand ----------
const groundGeo = new THREE.PlaneGeometry(260, 260, 180, 180).rotateX(-Math.PI / 2);
const groundMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`${DUNE_GLSL} varying vec3 vW; varying vec3 vN;
    void main(){ vec3 p = position; p.y = dune(p.xz); float e = .6; float hx = dune(p.xz + vec2(e, 0.)), hz = dune(p.xz + vec2(0., e)); vN = normalize(vec3((p.y - hx) / e, 1., (p.y - hz) / e)); vec4 w = modelMatrix * vec4(p, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`precision highp float; uniform vec3 uSun; uniform float uTh; varying vec3 vW; varying vec3 vN;
    ${SAND_GLSL}
    void main(){
      vec3 V = normalize(cameraPosition - vW); float dist = length(cameraPosition - vW);
      float lod = smoothstep(120., 6., dist);                                 // fade micro-relief with distance (no shimmering)
      vec3 N = sandNormal(vW.xz, normalize(vN), 1.5 * lod);
      vec3 alb = sandAlbedo(vW.xz);
      alb *= .78 + .44 * sandH(vW.xz * .8);                                   // ripples and grain also modulate the colour, so the texture reads from afar
      alb = mix(alb, alb * vec3(1.18, .78, .72), smoothstep(.55, .8, fbm2(vW.xz * .11)) * .35);   // faint rust-red drifts in the sand
      float dif = max(dot(N, uSun), 0.), wrap = max(dot(N, uSun) * .5 + .5, 0.);
      float back = pow(max(dot(reflect(-V, N), uSun), 0.), 14.);
      // glinting grains: sparse cells catch the sun
      float cell = h21(floor(vW.xz * 30.)); float glint = step(.992, cell) * pow(max(dot(reflect(-V, N), uSun), 0.), 5.) * lod;
      vec3 col = alb * (.10 + dif * 1.05 + wrap * .12) + vec3(1., .6, .3) * back * .3 + vec3(1., .8, .55) * glint * 1.6;
      col += vec3(1., .72, .45) * pow(1. - max(dot(N, V), 0.), 4.) * .05;
      float fog = 1. - exp(-dist * .021);
      // very subtle red specks scattered over the sand, like stars in the sky (two scales, slow twinkle, fade into the haze)
      for (int s = 0; s < 2; s++) {
        float sc = s == 0 ? .7 : 2.2; vec2 rg = vW.xz * sc, rid = floor(rg), rf = fract(rg) - .5; float rh = h21(rid + 3.1 + float(s) * 17.), rj = h21(rid * 1.3 + 8.8);
        float rs = step(s == 0 ? .93 : .96, rh) * smoothstep(s == 0 ? .1 : .16, .0, length(rf - (vec2(rj, h21(rid + 5.5)) - .5) * .6));
        col += vec3(1., .16, .10) * rs * (.2 + .15 * sin(uTh * floor(1. + rj * 3.) + rh * 50.)) * (1. - fog) * lod;
      }
      vec3 fc = mix(vec3(.34, .21, .12), vec3(1., .6, .28), pow(max(dot(-V, uSun), 0.), 8.) * .9);
      gl_FragColor = vec4(mix(col, fc, fog), 1.);
    }`
});
const ground = new THREE.Mesh(groundGeo, groundMat); ground.frustumCulled = false;

// ---------- brutalist monoliths (intact, instanced, stepped profiles) ----------
const COUNT = 90, geo = new THREE.BoxGeometry(1, 1, 1, 1, 36, 1); geo.translate(0, 0.5, 0);
const slabMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`varying vec3 vW; varying vec3 vN; varying vec3 vL; varying float vSeed;
    void main(){
      float seed = fract(sin(dot(instanceMatrix[3].xz, vec2(12.9898, 78.233))) * 43758.5453); vSeed = seed;
      vec3 p = position;
      // ziggurat setbacks: higher tiers step inward (only on some towers), a few wide podiums stay plain
      float lvl = floor(p.y * 4. + .001); float tiers = 0.;                                    // slender monoliths: straight shafts, no setbacks
      p.xz *= 1. - lvl * .13 * tiers;
      vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.); vW = w.xyz; vN = normalize(mat3(modelMatrix * instanceMatrix) * normal); vL = position;
      gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`precision highp float; uniform vec3 uSun; varying vec3 vW; varying vec3 vN; varying vec3 vL; varying float vSeed;
    ${SAND_GLSL}
    void main(){
      vec3 V = normalize(cameraPosition - vW), N = normalize(vN);
      float dist = length(cameraPosition - vW), fres = pow(1. - abs(dot(N, V)), 2.5);
      float side = max(abs(N.x), abs(N.z)); float hz = abs(N.x) > .5 ? vW.z : vW.x;
      // board-formed concrete: vertical ribs, floor-line seams, deep slit openings, wind-worn grain
      float ribs = smoothstep(.35, .0, abs(fract(hz * 1.4) - .5) - .12) * side;
      float seam = smoothstep(.04, .0, abs(fract(vW.y / 3.6) - .5) - .47) * side;
      float slit = side * smoothstep(.04, .0, abs(fract(hz * .35 + vSeed * 4.) - .5) - .07) * smoothstep(.02, .0, abs(fract(vW.y / 3.6) - .5) - .3);
      float grain = fbm2(vW.xy * vec2(2., .6) + vW.zy * vec2(2., .6) + vSeed * 30.) * .55 + vn(vW.xz * 40. + vW.y * 40.) * .15;
      vec3 stone = mix(vec3(.28, .22, .17), vec3(.55, .44, .33), grain);
      stone *= 1. - ribs * .22 - seam * .35;
      stone = mix(stone, vec3(.02, .015, .012), slit * .92);
      vec3 Nr = normalize(N + vec3(0., 0., 0.) + (abs(N.y) < .5 ? vec3((ribs - .5) * .25 * (abs(N.x) > .5 ? 1. : 0.), 0., (ribs - .5) * .25 * (abs(N.z) > .5 ? 1. : 0.)) : vec3(0.)));
      float dif = max(dot(Nr, uSun), 0.), back = pow(max(dot(reflect(-V, Nr), uSun), 0.), 7.);
      vec3 col = stone * (.14 + dif * .85) + vec3(1., .6, .3) * (fres * .30 + back * .38);
      // windblown sand coats the base and every upward-facing surface
      float coat = smoothstep(7., 0., vW.y) * .8 + step(.7, N.y) * .85;
      vec3 sandCol = sandAlbedo(vW.xz) * (.14 + max(dot(sandNormal(vW.xz, vec3(0., 1., 0.), .9 * smoothstep(60., 6., dist)), uSun), 0.) * .95);
      col = mix(col, sandCol, clamp(coat * (.55 + .45 * fbm2(vW.xz * .6 + vW.y * .2)), 0., .95));
      float fog = 1. - exp(-dist * .017 * (.45 + exp(-max(vW.y, 0.) * .06)));
      vec3 fc = mix(vec3(.34, .21, .12), vec3(1., .6, .28), pow(max(dot(-V, uSun), 0.), 8.) * .9);
      gl_FragColor = vec4(mix(col, fc, fog), 1.);
    }`
});
const slabs = new THREE.InstancedMesh(geo, slabMat, COUNT); slabs.frustumCulled = false;
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), pos = new THREE.Vector3(), sc = new THREE.Vector3();
for (let i = 0; i < COUNT; i++) {
  // slender monoliths: tall, narrow, intact; a few are a little stockier
  const z = -7 - Math.pow(R(), 0.85) * 70, side = R() < 0.5 ? -1 : 1, x = side * (3.5 + Math.pow(R(), 1.3) * 32);
  const stocky = R() > 0.85, h = stocky ? 10 + R() * 8 : 16 + R() * 30, w = stocky ? 2.6 + R() * 1.8 : 0.9 + R() * 1.7, d = stocky ? 2.6 + R() * 1.8 : 0.9 + R() * 1.7;
  e.set(0, Math.floor(R() * 4) * (Math.PI / 2) + (R() - 0.5) * 0.15, 0); q.setFromEuler(e);
  pos.set(x, duneJS(x, z) - 0.6, z); sc.set(w, h, d); m4.compose(pos, q, sc); slabs.setMatrixAt(i, m4);
}
slabs.instanceMatrix.needsUpdate = true;

// ---------- wind-blown sand ----------
const DN = 9000, dpos = new Float32Array(DN * 3), dseed = new Float32Array(DN * 4);
for (let i = 0; i < DN; i++) { dpos.set([(R() - 0.5) * 60, 0.08 + Math.pow(R(), 1.8) * 7, 6 - R() * 62], i * 3); dseed.set([R() * TAU, 1 + Math.floor(R() * 3), 1 + Math.floor(R() * 3), 0.3 + R() * 0.7], i * 4); }
const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3)); dgeo.setAttribute('aSeed', new THREE.BufferAttribute(dseed, 4));
const dustMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ uPx: { value: 1 } }, U), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  vertexShader: /* glsl */`attribute vec4 aSeed; uniform float uTh, uPx; uniform vec3 uSun; varying float vA;
    void main(){
      float tsec = uTh / 6.2831853 * 8.;
      vec3 p = position; p.x = mod(p.x + 30. + tsec * 7.5 * (1. + floor(aSeed.w * 1.99)), 60.) - 30.;
      p += vec3(0., sin(uTh * aSeed.y + aSeed.x) * .35, cos(uTh * aSeed.z + aSeed.x) * .5);
      vec4 mv = viewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv; gl_PointSize = max(1., uPx * aSeed.w * 11. / -mv.z);
      vec3 V = normalize(p - cameraPosition); vA = (.16 + 1.7 * pow(max(dot(V, uSun), 0.), 6.)) * aSeed.w * exp(-(-mv.z) * .022);
    }`,
  fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - .5) * 2.; gl_FragColor = vec4(vec3(1., .66, .38) * 1.1, vA * smoothstep(1., 0., d)); }`
});
const dust = new THREE.Points(dgeo, dustMat); dust.frustumCulled = false;
const world = new THREE.Scene(); world.add(ground, slabs, dust);

// ---------- occlusion pass ----------
const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const blackGround = new THREE.ShaderMaterial({ vertexShader: `${DUNE_GLSL} void main(){ vec3 p = position; p.y = dune(p.xz); gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(p, 1.); }`, fragmentShader: `void main(){ gl_FragColor = vec4(0., 0., 0., 1.); }` });
const slabsOcc = new THREE.InstancedMesh(geo, blackMat, COUNT); slabsOcc.instanceMatrix = slabs.instanceMatrix; slabsOcc.frustumCulled = false;
const groundOcc = new THREE.Mesh(groundGeo, blackGround); groundOcc.frustumCulled = false;
const occScene = new THREE.Scene(); occScene.add(slabsOcc, groundOcc);
let occ = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
const rayMat = new THREE.ShaderMaterial({
  vertexShader: VSQ, depthTest: false, depthWrite: false, transparent: true, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  uniforms: { tOcc: { value: null }, uLight: { value: new THREE.Vector2(.5, .5) }, uK: { value: 1 }, uOn: { value: 1 } },
  fragmentShader: /* glsl */`uniform sampler2D tOcc; uniform vec2 uLight; uniform float uK, uOn; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 d = (vUv - uLight) * .95 / 56.; vec2 uv = vUv - d * h(vUv * 931.7); float ill = 1., acc = 0.;
      for (int i = 0; i < 56; i++) { uv -= d; acc += texture2D(tOcc, uv).r * ill; ill *= .966; }
      float fall = 1. - smoothstep(.3, 1.7, length((vUv - uLight) * vec2(1.6, 1.)));
      gl_FragColor = vec4(vec3(1., .62, .30) * acc * .04 * uK * (.35 + .65 * fall) * uOn, 1.);
    }`
});
const rayScene = mkQuad(rayMat);

const cam = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
app.onResize((w, h, dpr) => {
  post.setSize(w, h, dpr); cam.aspect = w / h; cam.updateProjectionMatrix();
  occ.setSize(Math.max(2, Math.floor(w * dpr / 2)), Math.max(2, Math.floor(h * dpr / 2))); dustMat.uniforms.uPx.value = dpr * h / 900;
  for (const m of [skyMat, sunOccMat]) m.uniforms.uAspect.value = w / h;
});
const tanH = Math.tan(THREE.MathUtils.degToRad(30)); skyMat.uniforms.uTanH.value = sunOccMat.uniforms.uTanH.value = tanH;
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(), sp = new THREE.Vector3();

app.start((t) => {
  const th = TAU * t / DURATION, pt = app.pointer;
  U.uTh.value = th;
  const az = pt.x * 0.18, el = 0.12 + (pt.y * 0.5 + 0.5) * 0.12;
  U.uSun.value.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
  cam.position.set(Math.sin(th) * 1.6, 2.7 + Math.cos(th) * 0.25, 8); cam.lookAt(Math.sin(th) * 0.8, 4.0, -25);
  cam.updateMatrixWorld(); cam.matrixWorld.extractBasis(right, up, fwd); fwd.negate();
  for (const m of [skyMat, sunOccMat]) { m.uniforms.uRight.value.copy(right); m.uniforms.uUp.value.copy(up); m.uniforms.uFwd.value.copy(fwd); }
  r.autoClear = false;
  r.setRenderTarget(post.scene); r.setClearColor(0x3a2417, 1); r.clear();
  r.render(skyScene, ORTHO); r.render(world, cam);
  r.setRenderTarget(occ); r.setClearColor(0x000000, 1); r.clear();
  r.render(sunOccScene, ORTHO); r.render(occScene, cam);
  sp.copy(cam.position).addScaledVector(U.uSun.value, 200).project(cam);
  rayMat.uniforms.uLight.value.set(sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5); rayMat.uniforms.uOn.value = U.uSun.value.dot(fwd) < 0 ? 0 : 1; rayMat.uniforms.tOcc.value = occ.texture;
  r.setRenderTarget(post.scene); r.render(rayScene, ORTHO);
  r.autoClear = true;
  post.bloomAndComposite(t);
});
</script>
</body>
</html>
