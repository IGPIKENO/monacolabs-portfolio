<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat Spiral · A Century of Warming</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="lib/pro.css">
<style>:root{--bg:#07050d;--fg:#f4eee6;--mut:#a79bb6;--acc2:#ff9a3d}.hud.title{left:34px}</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createApp, THREE, hud, TAU, DURATION, smoothstep } from './lib/common.js';
import { layer, px, hash } from './lib/c2d.js';

hud({ eyebrow: 'Radial time series · synthetic anomaly', title: 'Heat Spiral', text: 'Each turn of the spiral is one year, January at the top, and the line sits further out when the month ran warmer than the baseline. A hundred and forty-five invented years wind outward from cold violet to white-hot.', tip: 'Move the cursor over a turn to read that year' });
const app = createApp({ label: 'Spiral · 1 pass', clear: 0x07050d });

const L = layer(app, { frag: /* glsl */`
  float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  void main(){ vec2 px = vUv * uRes; vec3 s = texture2D(tC, vUv).rgb;
    vec3 g = vec3(0.); for (int i = 0; i < 12; i++) { float a = float(i) * .5236; for (int k = 1; k < 4; k++) g += texture2D(tC, vUv + vec2(cos(a), sin(a)) * float(k) * float(k) * 2.4 / uRes).rgb / float(k); }
    g /= 12. * 1.83; vec3 col = s + g * 1.15;
    col += vec3(.020, .010, .030) * smoothstep(1.2, .0, length((vUv - .5) * vec2(uAsp, 1.)));
    col *= 1. - .35 * smoothstep(.5, 1.3, length((vUv - .5) * vec2(uAsp, 1.)));
    col += (h21(px + floor(uTime * 30.)) - .5) * .016; gl_FragColor = vec4(col, 1.); }` });

const NY = 145, Y0 = 1880;
// synthetic anomaly: a slow trend that accelerates, a seasonal wobble that drifts, plus smooth year-to-year noise
const anom = (y, m) => { const yy = y + m / 12, trend = 2.35 * Math.pow(Math.max(0, yy) / NY, 1.9) - .25, seas = .22 * Math.sin(TAU * m / 12 + yy * .09) + .1 * Math.sin(TAU * m / 6 + yy * .3);
  const n0 = hash(Math.floor(yy * 3), 5) , n1 = hash(Math.floor(yy * 3) + 1, 5), f = yy * 3 - Math.floor(yy * 3); const noise = ((n0 + (n1 - n0) * (f * f * (3 - 2 * f))) - .5) * .34; return trend + seas + noise; };
const IRON = [[0, [72, 54, 190]], [.28, [160, 52, 190]], [.52, [235, 70, 70]], [.74, [255, 150, 40]], [.9, [255, 215, 110]], [1, [255, 250, 225]]];
const ramp = u => { for (let i = 1; i < IRON.length; i++) if (u <= IRON[i][0]) { const [a, A] = IRON[i - 1], [b, B] = IRON[i], f = (u - a) / (b - a); return A.map((v, k) => Math.round(v + (B[k] - v) * f)); } return IRON[IRON.length - 1][1]; };
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
app.start((t) => {
  const { ctx } = L; L.begin(); const W = L.w, H = L.h, ptr = px(app, L); ctx.fillStyle = '#07050d'; ctx.fillRect(0, 0, W, H);
  const cx = W * .5, cy = H * .5, S = Math.min(W * .9, H) * .38, rOf = a => S * (.28 + a * .26), pos = (a, ang) => [cx + Math.sin(ang) * rOf(a), cy - Math.cos(ang) * rOf(a)];
  const g = smoothstep(0, .3, t) * (1 - smoothstep(7.3, 7.95, t)), prog = smoothstep(.25, 6.6, t), head = prog * NY;
  // reference rings at 0, +1, +2 degrees and the month spokes
  ctx.strokeStyle = 'rgba(190,170,215,.16)'; ctx.lineWidth = 1; ctx.fillStyle = 'rgba(200,185,225,.6)'; ctx.font = '500 11px "Inter", sans-serif'; ctx.textAlign = 'center';
  [0, 1, 2, 3].forEach(a => { ctx.setLineDash(a === 0 ? [] : [3, 5]); ctx.beginPath(); ctx.arc(cx, cy, rOf(a), 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.fillText((a > 0 ? '+' : '') + a.toFixed(1) + ' °C', cx, cy - rOf(a) - 5); });
  for (let m = 0; m < 12; m++) { const an = m / 12 * TAU, [x, y] = pos(-.2, an), [x2, y2] = pos(3.1, an); ctx.strokeStyle = 'rgba(190,170,215,.07)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x2, y2); ctx.stroke(); const [lx, ly] = pos(3.45, an); ctx.fillStyle = 'rgba(200,185,225,.65)'; ctx.fillText(MON[m], lx, ly + 4); }
  // hovered year
  const dx = ptr.x - cx, dy = ptr.y - cy, pr = Math.hypot(dx, dy); let pang = Math.atan2(dx, -dy); if (pang < 0) pang += TAU;
  let hy = -1; if (pr > S * .3) { let best = 1e9; for (let y = 0; y < Math.min(NY, Math.floor(head)); y++) { const a = anom(y, pang / TAU * 12), d = Math.abs(rOf(a) - pr); if (d < best) { best = d; hy = y; } } if (best > S * .09) hy = -1; }
  ctx.globalAlpha = g; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const last = Math.min(NY - 1, Math.floor(head));
  for (let y = 0; y <= last; y++) {
    const u = y / (NY - 1), c = ramp(u), full = y < last, frac = full ? 12 : (head - last) * 12; if (frac <= 0) continue;
    const steps = Math.ceil(frac * 4); ctx.beginPath();
    for (let k = 0; k <= steps; k++) { const m = Math.min(frac, 12) * k / steps, [x, yy] = pos(anom(y, m), m / 12 * TAU); k ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
    const a = hy === y ? 1 : (.2 + .6 * Math.pow(u, 1.3)); ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(hy >= 0 && hy !== y ? a * .5 : a).toFixed(3)})`; ctx.lineWidth = (hy === y ? 3 : .8 + 1.2 * u); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // centre: the year counter in the colour of the head of the line
  const yr = Y0 + Math.min(NY - 1, Math.floor(head)), hc = ramp(Math.min(1, head / NY));
  ctx.globalAlpha = g; ctx.textAlign = 'center'; ctx.fillStyle = `rgb(${hc[0]},${hc[1]},${hc[2]})`; ctx.font = `700 ${Math.round(S * .21)}px "Space Grotesk", sans-serif`; ctx.fillText(String(yr), cx, cy + S * .07);
  ctx.fillStyle = 'rgba(200,185,225,.7)'; ctx.font = '500 11px "Inter", sans-serif'; ctx.fillText('SYNTHETIC ANOMALY · °C vs 1880–1900 BASELINE', cx, cy + S * .17);
  if (hy >= 0) { const v = anom(hy, pang / TAU * 12), lab = `${Y0 + hy} · ${MON[Math.floor(pang / TAU * 12) % 12]} · ${v >= 0 ? '+' : ''}${v.toFixed(2)} °C`; ctx.font = '700 13px "Space Grotesk", sans-serif'; const w = ctx.measureText(lab).width + 20, bx = Math.min(W - w - 10, ptr.x + 16), by = ptr.y - 34; ctx.fillStyle = '#07050d'; ctx.fillRect(bx, by, w, 26); ctx.strokeStyle = 'rgba(255,235,200,.7)'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, w, 26); ctx.fillStyle = '#ffe9c2'; ctx.textAlign = 'left'; ctx.fillText(lab, bx + 10, by + 17); }
  ctx.globalAlpha = 1;
  L.render(t);
});
</script>
</body>
</html>
