<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio 3D · Campo de partículas néon</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#010208;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at center,#07071c 0%,#010208 70%);cursor:none;font-family:'Inter',system-ui,sans-serif}
  #stage canvas{position:absolute;inset:0;width:1920px;height:1080px}
  #orb{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;
       background:radial-gradient(circle,#fff 0%,#9ff 35%,rgba(0,255,255,0) 70%);box-shadow:0 0 50px 14px rgba(0,230,255,.55)}
  #title{position:absolute;left:80px;top:64px;pointer-events:none}
  #title b{display:block;font-size:30px;font-weight:800;letter-spacing:.26em;color:#fff}
  #title span{display:block;margin-top:10px;font:500 20px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:rgba(120,230,255,.7);text-transform:uppercase}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="vig"></div>
  <div id="orb"></div>
  <div id="title"><b>GRAVITY FIELD</b><span>14.000 partículas · gravidade + vórtice do cursor · <i id="tc" style="font-style:normal">0.00s</i></span></div>
</div>

<script type="module">
import * as THREE from './vendor/three/build/three.module.js';

const W = 1920, H = 1080, D = 8, TAU = Math.PI * 2;
const stage = document.getElementById('stage'), orb = document.getElementById('orb'), tcEl = document.getElementById('tc');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const ptr = { x: 0, y: 0, last: -1e9 };
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  ptr.x = (e.clientX - r.left) / r.width * W; ptr.y = (e.clientY - r.top) / r.height * H; ptr.last = performance.now();
});
const cursorAt = (t, live) => (live && performance.now() - ptr.last < 3000) ? [ptr.x, ptr.y]
  : [W / 2 + Math.sin(TAU * t / D) * 620 + Math.sin(TAU * 3 * t / D) * 120, H / 2 + Math.sin(TAU * 2 * t / D + 1) * 300];

const N = 14000;
const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
const hx = new Float32Array(N), hy = new Float32Array(N);   // posição "casa" (galáxia em espiral)
{
  for (let i = 0; i < N; i++) {
    const u = (i + .5) / N, r = Math.sqrt(u) * 780, a = i * 2.399963 + r * 0.006;
    const j = ((i * 7919) % 1000) / 1000 - .5;
    hx[i] = Math.cos(a) * (r + j * 30) * 1.25; hy[i] = Math.sin(a) * (r + j * 30) * .78;
  }
}
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(N * 3), spd = new Float32Array(N);
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aSpeed', new THREE.BufferAttribute(spd, 1));
geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(W / 2, H / 2, 0), 3000);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, W, H, 0, -10, 10);
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute float aSpeed; varying float vS;
    void main(){
      vS = clamp(aSpeed/420., 0., 1.);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);
      gl_PointSize = 4.4 + vS*7.;
    }`,
  fragmentShader: /* glsl */`
    varying float vS;
    void main(){
      float d = length(gl_PointCoord-.5); if(d>.5) discard;
      float a = pow(1.-d*2., 1.5);
      vec3 c = mix(vec3(.05,.75,1.), vec3(1.,.15,.8), smoothstep(.1,.8,vS));
      c += vec3(1.)*smoothstep(.65,1.,vS)*.6;
      gl_FragColor = vec4(c*(1.1+vS*1.1), a*(.8+vS*.2));
    }`
});
scene.add(new THREE.Points(geo, mat));

function reset() { for (let i = 0; i < N; i++) { px[i] = W / 2 + hx[i]; py[i] = H / 2 + hy[i]; vx[i] = vy[i] = 0; } }
function step(t, live, dt) {
  const [cx0, cy0] = cursorAt(t, live), cx = cx0, cy = H - cy0;
  const a = TAU * t / D * 0.5 * 0 + 0, c = Math.cos(a), s = Math.sin(a);  // rotação das casas desativada (campo estável)
  const K = 5.5, G = 3.4e7, SW = .55, damp = .975;
  for (let i = 0; i < N; i++) {
    const tx = W / 2 + hx[i] * c - hy[i] * s, ty = H / 2 + hx[i] * s + hy[i] * c;
    let ax = (tx - px[i]) * K, ay = (ty - py[i]) * K;
    const dx = cx - px[i], dy = cy - py[i], r2 = dx * dx + dy * dy + 200 * 200, g = G / (r2 * Math.sqrt(r2) / 1) * 1;
    ax += dx * g + (-dy) * g * SW; ay += dy * g + dx * g * SW;
    vx[i] = (vx[i] + ax * dt) * damp; vy[i] = (vy[i] + ay * dt) * damp;
    px[i] += vx[i] * dt; py[i] += vy[i] * dt;
  }
}
let simOK = false;
function render(t, live) {
  const dt = 1 / 60;
  if (live && simOK) step(t, true, dt);
  else { reset(); for (let q = -D; q < t; q += dt) step(q, false, dt); }
  simOK = live;
  for (let i = 0; i < N; i++) {
    pos[i * 3] = px[i]; pos[i * 3 + 1] = py[i]; pos[i * 3 + 2] = 0;
    spd[i] = Math.hypot(vx[i], vy[i]);
  }
  geo.attributes.position.needsUpdate = true; geo.attributes.aSpeed.needsUpdate = true;
  renderer.render(scene, camera);
  const [cx, cy] = cursorAt(t, live);
  orb.style.transform = `translate(${cx}px,${cy}px)`;
  tcEl.textContent = t.toFixed(2) + 's';
}
let manual = false, start = performance.now();
window.DURATION = D;
window.seek = s => { manual = true; render(((s % D) + D) % D, false); };
window.resume = () => { manual = false; simOK = false; start = performance.now(); };
(function loop() { if (!manual) render(((performance.now() - start) / 1000) % D, true); requestAnimationFrame(loop); })();
window.__ready = true;
</script>
</body>
</html>
